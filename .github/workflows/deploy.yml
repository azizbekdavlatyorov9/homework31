name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository'ni GitHub Actions runner'ga yuklash
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Serverga SSH orqali ulanish va deploy
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 20m

          script: |
            set -e

            echo "🚀 Deployment started..."

            APP_DIR="/ci_cd"

            # ==========================================
            # 1. Project papkasini yaratish
            # ==========================================
            if [ ! -d "$APP_DIR" ]; then
              echo "📁 Creating project directory..."
              mkdir -p "$APP_DIR"
            fi

            cd "$APP_DIR"

            # ==========================================
            # 2. Repository'ni clone qilish yoki update
            # ==========================================
            if [ ! -d ".git" ]; then
              echo "📥 Cloning repository..."

              rm -rf "$APP_DIR"/*
              rm -rf "$APP_DIR"/.[!.]* "$APP_DIR"/..?* 2>/dev/null || true

              git clone https://github.com/azizbekdavlatyorov9/homework31.git "$APP_DIR"

              cd "$APP_DIR"
            else
              echo "🔄 Updating repository..."

              git fetch origin
              git reset --hard origin/main
              git clean -fd
            fi

            # ==========================================
            # 3. Git tekshirish
            # ==========================================
            if [ ! -d ".git" ]; then
              echo "❌ Git repository not found!"
              exit 1
            fi

            echo "✅ Repository is ready"

            # ==========================================
            # 4. Node.js tekshirish
            # ==========================================
            echo "🔍 Checking Node.js..."

            node -v
            npm -v

            # ==========================================
            # 5. PM2 tekshirish
            # ==========================================
            echo "🔍 Checking PM2..."

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "📦 PM2 not found. Installing..."
              sudo npm install -g pm2
            fi

            pm2 -v

            # ==========================================
            # 6. Environment variables
            # ==========================================
            echo "⚙️ Creating .env..."

            cat > .env << EOF
            PORT=${{ secrets.PORT }}
            EOF

            # ==========================================
            # 7. Dependencies
            # ==========================================
            echo "📦 Installing dependencies..."

            npm install

            # ==========================================
            # 8. Build
            # ==========================================
            echo "🔨 Building application..."

            npm run build

            # ==========================================
            # 9. PM2 application
            # ==========================================
            echo "🚀 Starting application..."

            if pm2 describe ci_cd_app >/dev/null 2>&1; then
              echo "🔄 Restarting existing application..."

              pm2 restart ci_cd_app --update-env
            else
              echo "🆕 Starting new application..."

              pm2 start dist/main.js \
                --name ci_cd_app \
                --update-env
            fi

            # ==========================================
            # 10. PM2 save
            # ==========================================
            pm2 save

            # ==========================================
            # 11. Status
            # ==========================================
            echo "📊 Application status:"

            pm2 status

            echo "======================================"
            echo "✅ Deployment completed successfully!"
            echo "======================================"