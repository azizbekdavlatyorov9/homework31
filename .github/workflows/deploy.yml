name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: PORT
          script: |
            set -e

            APP_DIR="/ci_cd"
            
            if [ ! -d "$APP_DIR" ]; then
              mkdir -p "$APP_DIR"
              git clone https://github.com/azizbekdavlatyorov9/homework31.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            if [ ! -d .git ]; then
              echo "❌ Repo not cloned properly. Aborting."
              exit 1
            fi

            git pull origin main

            echo "PORT=${{ secrets.PORT }}" > .env
            
            # Nodejs va PM2 path'larini to'g'ri topish uchun
            export PATH=$PATH:/usr/bin:/usr/local/bin:~/.nvm/versions/node/$(node -v)/bin

            npm install
            npm run build

            if pm2 list | grep -q "ci_cd_app"; then
              pm2 restart ci_cd_app
            else
              pm2 start dist/main.js --name ci_cd_app
            fi

            pm2 save